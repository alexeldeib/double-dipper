name: Weekly recap

on:
  schedule:
    - cron: "0 2 * * 3" # Tuesday 7pm Pacific (Wednesday 02:00 UTC)
  workflow_dispatch:
    inputs:
      week:
        description: Week to recap (blank = latest scored week)
        required: false
      fresh:
        description: Rewrite the jokes even if this week already has some
        type: boolean
        default: false
      dry_run:
        description: Test only; show the jokes in the run summary, don't commit or deploy
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [template.html, recap.py, prompt.md, punchup.md]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: recap
  cancel-in-progress: false

jobs:
  recap:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install anthropic
      # A push only restyles the existing weeks; the schedule and manual runs fetch a new week.
      - run: python recap.py ${{ github.event_name == 'push' && 'render' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WEEK: ${{ inputs.week }}
          FRESH: ${{ inputs.fresh }}
          DRY_RUN: ${{ inputs.dry_run }}
      - name: Show the jokes (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          python - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, json, os
          d = json.load(open(max(glob.glob("weeks/*.json"), key=os.path.getmtime)))
          c, w = d["copy"], d["facts"]["week"]
          print(f"## Week {w} dry run, written by `{c.get('by')}`\n\n# {c['headline']}\n\n{c['dek']}\n")
          print(f"**{c['hero_value']}**: {c['hero_caption']}  \nMarker: {' / '.join(c['pen_notes'])}\n")
          print("\n\n".join(c.get("story", [])) + "\n\n### Power rankings")
          print("\n".join(f"- **{x['key']}**: {x['line']}" for x in c.get("power_lines", [])))
          print("\n### Trophies")
          print("\n".join(f"- **{x['key']}**: {x['line']}" for x in c["award_lines"]))
          print("\n### Games\n" + "\n".join(f"- {x['line']}" for x in c["game_lines"]))
          print("\n### Next week\n" + "\n".join(f"- {x['line']}" for x in c["preview_lines"]))
          print(f"\n_{c['signoff']}_")
          EOF
      - name: Commit the new week
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weeks
          if ! git diff --cached --quiet; then
            git commit -m "Recap: week data"
            git push
          fi
      - uses: actions/upload-pages-artifact@v5
        if: ${{ !inputs.dry_run }}
        with:
          path: docs
      - id: deploy
        if: ${{ !inputs.dry_run }}
        uses: actions/deploy-pages@v5
